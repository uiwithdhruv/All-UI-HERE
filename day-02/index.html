<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 2 - Hover Card</title>
  <style>
    /* Day 2 UI by @uiwithdhruv */
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #0f0f1a;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 280px;
      padding: 24px;
      border-radius: 20px;
      background: #1a1a2e;
      text-align: center;
      cursor: pointer;
      transition: 0.4s;
    }
    .img {
      height: 160px;
      border-radius: 14px;
      margin-bottom: 16px;
      background: linear-gradient(45deg, #ff0080, #7928ca);
    }
    h2 { margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #aaa; font-size: 14px; }
    button {
      padding: 10px 28px;
      border: none;
      border-radius: 30px;
      background: #7928ca;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-12px) scale(1.05);
      box-shadow: 0 20px 40px #7928ca80;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="img"></div>
    <h2>Hover Card</h2>
    <p>Mouse upar lao!</p>
    <button>Explore</button>
  </div>
</body>
</html>
